services:
  hermes-wow:
    image: docker.1panel.live/nousresearch/hermes-agent:latest
    container_name: hermes-wow
    restart: unless-stopped
    command: gateway run -vv
    ports:
      - "8642:8642"
      - "127.0.0.1:9119:9119"
    volumes:
      - /home/wuya/.hermes-wow:/opt/data
    env_file:
      - /home/wuya/.hermes-wow/.env
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
