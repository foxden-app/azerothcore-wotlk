services:
  hermes-wow-dev:
    image: docker.1panel.live/nousresearch/hermes-agent:latest
    container_name: hermes-wow-dev
    restart: unless-stopped
    init: true
    network_mode: host
    volumes:
      - /home/wuya/.hermes-wow-dev:/opt/data
    env_file:
      - /home/wuya/.hermes-wow-dev/.env
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "127.0.0.1"
      HERMES_DASHBOARD_PORT: "9120"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "127.0.0.1"
      API_SERVER_PORT: "8643"
    command: ["gateway", "run", "-vv"]
